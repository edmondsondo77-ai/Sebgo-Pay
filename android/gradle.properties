# Configurations JVM et mémoire pour Gradle
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Options AndroidX et Jetpack
android.useAndroidX=true
android.enableJetifier=true
android.useJetpack=true

# Options du projet Flutter / Gradle
android.newDsl=false
android.builtInKotlin=false
android.builder.sdkDownload=false
android.experimental.self-check.NDK=false
android.enableR8.fullMode=false
android.experimental.dependency-verification.enabled=false
android.bundle.enableSymbolProcessing=false
android.injected.testOnly=false

# Désactivation du blocage NDK/Strip
android.build.gradle.internal.tasks.StripDebugSymbolsTask.enabled=falsekotlin.incremental=false

kotlin.incremental=false
android.useNdk=false